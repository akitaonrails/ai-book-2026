# Shared continuity for parallel drafters. Read before drafting; the
# integration pass updates it between waves. Facts here are about the BOOK
# (who explains what, how things are named), not new claims.

narrator: >-
  Fabio Akita, first person ("eu"). Veteran programmer, ran the
  Akitando YouTube channel 2018-2023 (Aug 2018 to Dec 2023, 149 episodes), blog since 2006 (20 years in 2026),
  keeps a home server ("homelab"). Biographical facts beyond the posts need a source. Never refer to
  him as "Fabio"; "Akita" only when a third party speaks of him.

reader: "Addressed as 'você', informally. Never patronised, never insulted."

# Where each concept is explained properly. Elsewhere: mark the term with
# [termo]{.gls} (the glossary expands/links it) and, if needed, a half-clause
# reminder plus a cross-reference like "(veja @sec-ch02)". Don't re-explain.
explained_in:
  ch01: [llm, token, parametros, pesos, transformer, inferencia, agi, bolha, "curva em S", "treino vs uso"]
  ch02: [contexto, janela-de-contexto, compactacao, rag, embedding, "memória de agente"]
  ch03: [agente, harness, tool-calling, mcp, system-prompt, prompt-caching, raciocinio]
  ch04: [alucinacao, sicofancia, "watermark/detector de IA"]
  ch05: [vibe-coding, prompt, "a regra dos 10%/90%"]
  ch06: [xp, tdd, ci, teste-de-integracao, refatoracao]
  ch08: ["oráculo (verificador externo)"]
  ch09: [skill, "AGENTS.md / CLAUDE.md"]
  ch11: [benchmark, "tier", "ruído entre execuções"]
  ch13: [vram, gpu, quantizacao, moe, modelo-aberto, destilacao, "largura de banda de memória"]
  ch14: [modelo-de-fronteira, "IPO"]
  ch15: [sandbox, snapshot]
  ch16: [prompt-injection, gateway, seguranca-por-obscuridade, regressao, revisao-adversarial]
  ch17: [fingerprint, engenharia-reversa]

section_ids: "Each chapter's H1 carries {#sec-<id>} (e.g. # Um modelo com mãos {#sec-ch03}). Cross-reference with @sec-chNN."

recurring_characters:
  frank-projects: >-
    Akita names his personal projects "Frank" + something (FrankMD, Frank
    Sherlock, Frank Yomik, Frank FBI, FrankClaw, Frank Investigator, Frank
    Karaoke, Frank GO, Frank Manga+). The name is a homage to Frank Rosenblatt,
    creator of the Perceptron (1957), as the posts themselves say. ch01
    introduces Rosenblatt (cite rosenblatt1957perceptron); ch05 (FrankMD, the
    first) explains the naming once. Never call them Frankenstein creatures.
  the-m-akita-chronicles: "Weekly newsletter + AI-narrated podcast built in February (ch06)."
  the-benchmark: "Akita's LLM coding benchmark, introduced in ch11; earlier chapters may foreshadow it."
  claude-code: "Anthropic's coding agent, Akita's main tool for most of the year."
  opencode-crush: "Open-source terminal agents (harnesses) he also used."
  the-girlfriend: "Influencer; do not name her. 'minha namorada'."
  ai-jail: "Akita's open-source sandbox for agents (ch15). Describe as 'accident guard, not a fortress'."
  ai-memory: "Akita's open-source memory system for agents (ch02 mention, ch20 resolution, apmemoria appendix: features and quick start; site aimemory.sh). ai-jail site: aijail.io."

time_anchor: >-
  The narrative present is October 2026. Dates in absolute form. Model names
  are period details, like car models in a novel: fine to name, never presented
  as "the best" without the month attached.

naming:
  - "Claude Code, Codex, OpenCode, Crush: product names, no italics."
  - "Model names as the vendor writes them: Claude Opus 4.5, GPT-5.5, GLM 4.7, Kimi K3, DeepSeek V4."
  - "OpenAI tiers (the blog is inconsistent; the book fixes one form): hyphen + capitalised tier, GPT-5.4 Sol, GPT-5.6 Sol/Luna/Terra, GPT-6 Sol/Luna/Astra; a tier alone is capitalised too (o Sol, o Terra)."
  - "Z.ai (never z.ai). 'Sprint' is feminine (a sprint)."
  - "A cross-reference used as subject or after como/que/porque takes the article: o @sec-ch15."
  - "PT-BR cross-references following em take the definite article: no @sec-ch15, no @sec-apB, na @sec-aptecnico-rag, nos @sec-creditos. Repeat the contraction in coordinated references: no @sec-ch04 e no @sec-ch15."
  - "Book and paper titles in italics."

# The mechanical subset of `naming`, enforced by scripts/lint_chapter.rb (errors).
# pattern: Ruby regex (case-sensitive unless it carries (?i:...)); use: replacement
# with \1.. back-references, shown in the message; langs: editions it applies to.
# Not checked inside markdown link texts or *italic titles* followed by a URL.
naming_rules:
  - {pattern: '\bGPT (\d)', use: 'GPT-\1', langs: [pt, en]}
  - {pattern: '\bGPT-(\d(?:\.\d)?)[- ](sol|luna|terra|astra)\b', use: 'GPT-\1 \2 (tier capitalised)', langs: [pt, en]}
  - {pattern: '\bGPT-(\d(?:\.\d)?)-(Sol|Luna|Terra|Astra)\b', use: 'GPT-\1 \2', langs: [pt, en]}
  - {pattern: '\bz\.ai\b', use: 'Z.ai', langs: [pt, en]}
  - {pattern: '(?i:\b(um|o|este|esse|aquele) sprint\b)', use: 'a/uma/esta/essa/aquela sprint (feminine)', langs: [pt]}

# docs/EDITORIAL-RULES.md R6: figures that recur across chapters. Each value
# carries its scope; a unit that states the figure must use one of these
# values with its scope (doctor: canonical_figures).
canonical_figures:
  speedup:
    - {value: "umas cinco vezes", scope: "média da maratona, fev-mai 2026, estimativa do autor (05/14)", home: ch10}
    - {value: "seis a sete vezes", scope: "FrankMD, 30 h contra ~200 h estimadas (02/01)", home: ch05}
    - {value: "19% mais lentos", scope: "estudo controlado do METR com programadores experientes em código que conheciam", home: ch20}
  repositories:
    - {value: "24", scope: "maratona, 27 jan a mai 2026, 6 privados (05/14)", home: ch10}
    - {value: "mais de 30", scope: "repositórios públicos desde janeiro, em agosto (08/18)", home: ch14}
    - {value: "mais de 40", scope: "repositórios públicos mantidos, em setembro (09/17)", home: ch09}
  hours:
    - {value: "mais de 500 horas", scope: "fevereiro a maio de 2026", home: ch10}

# R10: recurring lines and the units allowed to state them; elsewhere call back
# in new words (style report: signature_lines).
signature_lines:
  - {pattern: 'espelho da sua (própria )?competência', units: [ch06, ch07, ch20]}

# R3: phrases that usually signal an unsupported generalization (lint warns;
# fine when backed by data or framed as the author's view).
generalization_watch:
  pt: ['\b(a|da|na) maioria (dos|das) (pessoas|profissionais|empresas|usuários)\b', '\bninguém sério\b', '\btodo mundo sabe\b', '\bgente que entende\b']
  en: ['\bmost (people|professionals|companies|users)\b', '\bnobody serious\b', '\beveryone knows\b']
